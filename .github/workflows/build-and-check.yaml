# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, mooreryan/build-and-check]
  pull_request:

name: build-and-check.yaml

permissions: read-all

jobs:
  build-and-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})${{ matrix.config.manual && ' + manual' || '' }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          # Only this job builds and checks the PDF reference manual (needs LaTeX).
          - {os: ubuntu-latest,  r: 'release', manual: true}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Fail if any Suggests package is missing, rather than letting vignettes
      # silently skip chunks (e.g. `eval = phy` in the phyloseq vignette).
      _R_CHECK_FORCE_SUGGESTS_: true

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      # Needed to build/check the PDF reference manual (the script's TinyTeX step)
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # The action's defaults pass --no-manual to both build and check. On
          # the manual job, drop it so the PDF manual is built and checked
          # (as CRAN does); keep it everywhere else.
          build_args: ${{ matrix.config.manual && 'character()' || '"--no-manual"' }}
          args: ${{ matrix.config.manual && 'c("--as-cran")' || 'c("--no-manual", "--as-cran")' }}
